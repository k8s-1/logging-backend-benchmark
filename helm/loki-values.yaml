deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-data
    s3:
      endpoint: http://minio.observability.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      s3ForcePathStyle: true
      insecure: true

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
    ingestion_rate_mb: 50
    ingestion_burst_size_mb: 100
    unordered_writes: true

singleBinary:
  replicas: 1
  nodeSelector:
    bench-role: engines
  tolerations:
    - key: bench-role
      operator: Equal
      value: engines
      effect: NoSchedule
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 500m
      memory: 2048Mi

write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false

resultsCache:
  enabled: false

chunksCache:
  enabled: false

minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  rules:
    enabled: false
  dashboards:
    enabled: false
