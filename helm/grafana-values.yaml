adminUser: admin
adminPassword: admin

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Admin
  auth:
    disable_login_form: true

plugins:
  - quickwit-quickwit-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Quickwit k8s-logs
        uid: quickwit-k8s-logs
        type: quickwit-quickwit-datasource
        access: proxy
        url: http://quickwit-searcher.observability.svc.cluster.local:7280/api/v1
        isDefault: true
        jsonData:
          index: k8s-logs
          timeField: timestamp
          logMessageField: message
          logLevelField: level

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    k8s-logs:
      json: |
        {
          "title": "Kubernetes Logs (Quickwit)",
          "uid": "k8s-logs-quickwit",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "refresh": "10s",
          "time": { "from": "now-15m", "to": "now" },
          "templating": {
            "list": [
              {
                "name": "search",
                "type": "textbox",
                "label": "Search",
                "query": "*",
                "current": { "text": "*", "value": "*" }
              },
              {
                "name": "Filters",
                "type": "adhoc",
                "label": "Filters",
                "datasource": { "type": "quickwit-quickwit-datasource", "uid": "quickwit-k8s-logs" },
                "filters": []
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "title": "Log volume",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
              "datasource": { "type": "quickwit-quickwit-datasource", "uid": "quickwit-k8s-logs" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "quickwit-quickwit-datasource", "uid": "quickwit-k8s-logs" },
                  "query": "${search:raw}",
                  "metrics": [{ "id": "1", "type": "count" }],
                  "bucketAggs": [
                    {
                      "id": "2",
                      "type": "date_histogram",
                      "field": "timestamp",
                      "settings": { "interval": "auto" }
                    }
                  ]
                }
              ]
            },
            {
              "id": 4,
              "title": "Matching logs",
              "type": "logs",
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
              "datasource": { "type": "quickwit-quickwit-datasource", "uid": "quickwit-k8s-logs" },
              "options": {
                "wrapLogMessage": true,
                "prettifyLogMessage": true,
                "enableLogDetails": true
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "quickwit-quickwit-datasource", "uid": "quickwit-k8s-logs" },
                  "query": "${search:raw}",
                  "metrics": [{ "id": "1", "type": "logs", "settings": { "limit": "100" } }],
                  "bucketAggs": []
                }
              ]
            }
          ]
        }

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
