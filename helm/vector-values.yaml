role: Agent

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 0.0.0.0:8686
  sources:
    k8s_logs:
      type: kubernetes_logs
  transforms:
    parse_json_logs:
      type: remap
      inputs: [k8s_logs]
      source: |
        parsed, err = parse_json(.message)
        if err == null {
          . = merge(., object!(parsed))
        }
  sinks:
    quickwit:
      type: elasticsearch
      inputs: [parse_json_logs]
      endpoints:
        - http://quickwit-indexer.observability.svc.cluster.local:7280/api/v1/_elastic
      mode: bulk
      api_version: v8
      bulk:
        index: k8s-logs
        action: create
      healthcheck:
        enabled: false
    loki:
      type: loki
      inputs: [parse_json_logs]
      endpoint: http://loki.observability.svc.cluster.local:3100
      encoding:
        codec: json
      dangerously_allow_unconfined_template_resolution: true
      labels:
        level: "{{ `{{ level }}` }}"
        module: "{{ `{{ module }}` }}"
      healthcheck:
        enabled: false
    victorialogs:
      type: elasticsearch
      inputs: [parse_json_logs]
      endpoints:
        - http://victorialogs.observability.svc.cluster.local:9428/insert/elasticsearch
      mode: bulk
      api_version: v8
      bulk:
        index: k8s-logs
        action: create
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: level,module
      healthcheck:
        enabled: false
